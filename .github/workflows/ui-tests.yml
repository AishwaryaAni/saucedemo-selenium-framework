name: UI Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      suite:
        description: "TestNG suite file"
        required: false
        default: "testng.xml"
        type: choice
        options: [ testng.xml, testng-smoke.xml ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Run tests (headless Chrome)
        run: >
          mvn -B clean test
          -Dbrowser=chrome
          -Dheadless=true
          -Dsuite=${{ github.event.inputs.suite || 'testng.xml' }}

      - name: Upload Extent report & screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            target/extent-report/
            target/screenshots/
            target/logs/
          retention-days: 14
